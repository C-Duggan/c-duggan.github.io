<footer class="jg-footer">
  <div class="jg-container jg-footer__inner">
    <p class="jg-footer__note">
      © {{ 'now' | date: "%Y" }} {{ site.title }}. Built with Jekyll on GitHub Pages, forked from the "academic" theme by LeNPaul.
    </p>
    <div class="jg-footer__social">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" aria-label="{{ item.icon }}"><i class="fab fa-{{ item.icon }}"></i></a>
      {% endfor %}
    </div>
  </div>
</footer>

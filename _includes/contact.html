<section class="jg-section" style="border-top: none; padding-top: var(--space-4);">
  <span class="jg-eyebrow">Get in touch</span>
  <h1 class="jg-section-title">Contact</h1>

  {% for contact in site.data.settings.contacts %}
    <div class="jg-hero" style="grid-template-columns: 0.85fr 1.15fr; padding: 0;">
      <div class="jg-hero__media" style="aspect-ratio: 1 / 1;">
        <img src="{{ site.github.url }}/assets/img/james_gullberg_headshot_cropped.jpg" alt="{{ contact.name }}">
      </div>
      <div>
        <h2 style="font-size: 1.5rem; margin-bottom: 0.3rem;">{{ contact.name }}</h2>
        <p class="jg-brand__tagline" style="text-transform:none; letter-spacing:normal; font-size:0.95rem; margin-bottom: var(--space-3);">{{ contact.department }} · {{ contact.institution }}</p>
        <p><i class="fas fa-envelope" aria-hidden="true" style="width:1.4rem; color: var(--accent);"></i> <a href="mailto:{{ contact.email }}" class="jg-link">{{ contact.email }}</a></p>
        <p><i class="fas fa-phone" aria-hidden="true" style="width:1.4rem; color: var(--accent);"></i> {{ contact.phone }}</p>
        <p><i class="fas fa-map-marker-alt" aria-hidden="true" style="width:1.4rem; color: var(--accent);"></i> {{ contact.location }}</p>
      </div>
    </div>
  {% endfor %}
</section>

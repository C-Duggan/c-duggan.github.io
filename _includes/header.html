<header class="jg-header">
  <div class="jg-container jg-header__inner">
    <a href="{{ site.github.url }}/" class="jg-brand">
      <span class="jg-brand__name">{{ site.title }}</span>
      <span class="jg-brand__tagline">{{ site.description }}</span>
    </a>

    <nav class="jg-nav" aria-label="Primary">
      <div class="jg-nav__links" data-nav-links>
        {% for item in site.data.settings.menu %}
          <a class="jg-nav__link" href="{{ site.github.url }}{{ item.url }}">{{ item.name }}</a>
        {% endfor %}
      </div>

      <button type="button" class="jg-theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <i class="fas fa-moon" aria-hidden="true"></i>
        <i class="fas fa-sun" aria-hidden="true"></i>
      </button>

      <button type="button" class="jg-nav-toggle" data-nav-toggle aria-label="Toggle menu" aria-expanded="false">
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
    </nav>
  </div>
</header>

---
layout: default
---

<section class="jg-section" style="border-top: none; padding-top: var(--space-4);">
  <span class="jg-eyebrow">Coursework</span>
  <h1 class="jg-section-title">{{ page.title }}</h1>
  {{ content }}

  <div>
    {% for course in site.data.settings.courses %}
      <div class="jg-list-row">
        <a href="{{ site.github.url }}/courses/{{ course.url }}" class="jg-link">{{ course.name }}</a>
        <i class="fas fa-arrow-right" aria-hidden="true" style="color: var(--text-muted);"></i>
      </div>
    {% endfor %}
  </div>
</section>
